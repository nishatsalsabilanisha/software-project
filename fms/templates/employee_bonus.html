<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Give Bonus</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4ff; }
        .card { max-width: 400px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: royalblue; text-align: center; }
        select, input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background: royalblue; color: white; border: none; cursor: pointer; }
        button:hover { background: navy; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Add Bonus</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="employee">Select Employee:</label>
            <select name="employee" id="employee" required>
                {% for emp in employees %}
                <option value="{{ emp.sl }}">{{ emp.name }} ({{ emp.position }})</option>
                {% endfor %}
            </select>

            <label for="bonus">Bonus Percentage (%):</label>
            <input type="number" name="bonus" id="bonus" min="1" max="100" required>

            <button type="submit">Apply Bonus</button>
        </form>
    </div>
</body>
</html>
