<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f0f4f8;
    color: #1a1a1a;
    padding: 20px;
}


h2 {
    color: #4169e1; 
    text-align: center;
    margin-bottom: 20px;
}


table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}

th, td {
    padding: 12px 15px;
    border: 5px solid #adb5e2;
    text-align: left;
}

th {
    background-color: #4169e1; 
    color: white;
}

tr:nth-child(even) {
    background-color: #e6ecff; 
}
tr:hover {
    background-color: #b0c4ff;
}
/* Button styling */
.btn {
    background-color: #4169e1; 
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

.btn:hover {
    background-color: #27408b; 

/* Checkbox alignment */
input[type="checkbox"] {
    transform: scale(1.2);
    cursor: pointer;
}
</style>

<h2>Take Attendance</h2>
<form method="post">
    {% csrf_token %}
    <table>
        <tr>
            <th>Employee ID - Name</th>
            <th>Present</th>
        </tr>
        {% for emp in employees %}
        <tr>
            <td>{{ emp.id }} - {{ emp.employee.name|default:"No Name" }}</td>
            <td>
                <input type="checkbox" name="attend_{{ emp.id }}" checked>
            </td>
        </tr>
        {% endfor %}
    </table>
    <button type="submit" class="btn">Submit Attendance</button>
</form>

<a href="{% url 'attendance_list' %}">Back to Attendance List</a>
