<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supplier Dashboard</title>
    <style>
       
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #dbeafe, #f0f9ff);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .navbar {
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            padding: 15px 30px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .navbar h2 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .logout-btn {
            padding: 10px 18px;
            background: #1e90ff;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background-color: #0d63c6; 
            transform: scale(1.05);
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .info-card {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px 25px;
            font-size: 16px;
        }
        .info-card p {
            margin: 0;
            padding: 12px;
            border-radius: 8px;
            background: #f8faff;
            transition: background 0.3s;
        }
        .info-card p:hover {
            background: #e0ecff;
        }
        .info-label {
            font-weight: bold;
            color: #1e3c72;
        }

    </style>
</head>
<body>


    <div class="navbar">
        <h2>Supplier Dashboard</h2>
        <a href="{% url 'supplier_logout' %}" class="logout-btn">Logout</a>
    </div>

    <div class="container">
        <h1>Welcome, {{ supplier.name }}</h1>
        <div class="info-card">
            <p class="info-label">Name:</p> <p>{{ supplier.name }}</p>
            <p class="info-label">Email:</p> <p>{{ supplier.email }}</p>
            <p class="info-label">Phone:</p> <p>{{ supplier.phone }}</p>
            <p class="info-label">Address:</p> <p>{{ supplier.address }}</p>
            <p class="info-label">Raw Material:</p> <p>{{ supplier.raw_material_name }}</p>
        </div>
    </div>

</body>
</html>
